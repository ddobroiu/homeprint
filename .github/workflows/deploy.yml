name: Deploy HomePrint

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
             DATABASE_URL=${{ secrets.DATABASE_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 178.104.33.34
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 60m
          timeout: 120s
          script: |
            set -euo pipefail
            export DOCKER_CLIENT_TIMEOUT=1200
            export COMPOSE_HTTP_TIMEOUT=1200

            mkdir -p /opt/apps/homeprint
            cd /opt/apps/homeprint
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "${{ secrets.ENV_CONTENTS }}" > .env

            cat <<EOF > docker-compose.yml
            services:
              homeprint-app:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: homeprint-app
                restart: unless-stopped
                ports:
                  - "3008:3000"
                env_file: .env
            EOF

            echo "=== Pull imagine (ARM: poate dura 15-25 min) ==="
            docker compose pull
            echo "=== Pornire container ==="
            docker compose up -d --force-recreate

            echo "=== Așteptare container (max ~2 min) ==="
            for i in $(seq 1 60); do
              if docker inspect -f '{{.State.Running}}' homeprint-app 2>/dev/null | grep -q true; then
                break
              fi
              sleep 2
            done
            docker exec homeprint-app node -e "process.exit(0)" >/dev/null 2>&1 || (echo "Container did not become ready" && docker logs --tail=200 homeprint-app && exit 1)

            echo "=== Curățare imagini vechi ==="
            docker image prune -af
